---
# Per environment values which override defaults in hmpps-document-generation-ui/values.yaml

generic-service:
  ingress:
    host: document-generation-dev.hmpps.service.justice.gov.uk
    className: modsec-non-prod
    modsecurity_snippet: |
      SecRuleEngine On
      # team here grants access to the OpenSearch logs to delve into the cause of the blockage
      SecDefaultAction "phase:2,pass,log,tag:github_team=hmpps-move-and-improve,tag:namespace={{ .Release.Namespace }}"
      # Default is only GET HEAD POST OPTIONS so need to include PUT etc.
      SecAction "id:900200,phase:1,nolog,pass,t:none,setvar:tx.allowed_methods=GET HEAD POST OPTIONS,setvar:tx.paranoia_level=3"
      # Block Detectify scanner with 418
      SecRule REQUEST_HEADERS:User-Agent "@pm detectify Detectify DETECTIFY" "id:800003,phase:1,deny,status:418,log,tag:github_team=hmpps-move-and-improve,tag:namespace={{ .Release.Namespace }}"
      # Change default denial to be a 406 so that we can tell easily that it is modsecurity doing the blocking
      SecRuleUpdateActionById 949110 "t:none,deny,status:406,logdata:%{SERVER_NAME}"
      SecRuleUpdateActionById 959100 "t:none,deny,status:406,logdata:%{SERVER_NAME}"

  env:
    INGRESS_URL: "https://document-generation-dev.hmpps.service.justice.gov.uk"
    HMPPS_AUTH_URL: "https://sign-in-dev.hmpps.service.justice.gov.uk/auth"
    TOKEN_VERIFICATION_API_URL: "https://token-verification-api-dev.prison.service.justice.gov.uk"
    COMPONENT_API_URL: "https://frontend-components-dev.hmpps.service.justice.gov.uk" # used by hmpps-connect-dps-components module
    PRISON_API_URL: "https://prison-api-dev.prison.service.justice.gov.uk" # used by hmpps-connect-dps-components module
    PRISONER_SEARCH_API_URL: "https://prisoner-search-dev.prison.service.justice.gov.uk"
    PRISON_REGISTER_API_URL: "https://prison-register-dev.hmpps.service.justice.gov.uk"
    DOCUMENT_GENERATION_API_URL: 'https://document-generation-api-dev.hmpps.service.justice.gov.uk'
    EXTERNAL_MOVEMENTS_API_URL: 'https://external-movements-api-dev.hmpps.service.justice.gov.uk'
    DPS_HOME_PAGE_URL: "https://digital-dev.prison.service.justice.gov.uk"
    PRISONER_PROFILE_URL: "https://prisoner-dev.digital.prison.service.justice.gov.uk"
    ENVIRONMENT_NAME: DEV
    SENTRY_ENVIRONMENT: DEV
    AUDIT_ENABLED: "true"

  allowlist:
    groups:
      - digital_staff_and_mojo
      - moj_cloud_platform
      - prisons
      - private_prisons
      - accessibility-testing-1

generic-prometheus-alerts:
  alertSeverity: move-and-improve-alerts-non-prod
  businessHoursOnly: true
