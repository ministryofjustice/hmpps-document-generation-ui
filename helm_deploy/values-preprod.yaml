---
# Per environment values which override defaults in hmpps-document-generation-ui/values.yaml

generic-service:
  replicaCount: 2

  ingress:
    host: document-generation-preprod.hmpps.service.justice.gov.uk

  env:
    INGRESS_URL: "https://document-generation-ui-preprod.hmpps.service.justice.gov.uk"
    HMPPS_AUTH_URL: "https://sign-in-preprod.hmpps.service.justice.gov.uk/auth"
    TOKEN_VERIFICATION_API_URL: "https://token-verification-api-preprod.prison.service.justice.gov.uk"
    DOCUMENT_GENERATION_API_URL: 'https://document-generation-api-preprod.hmpps.service.justice.gov.uk'
    DPS_HOME_PAGE_URL: "https://digital-preprod.prison.service.justice.gov.uk"
    PRISONER_PROFILE_URL: "https://prisoner-preprod.digital.prison.service.justice.gov.uk"
    ENVIRONMENT_NAME: PRE-PRODUCTION
    AUDIT_ENABLED: "false"

generic-prometheus-alerts:
  alertSeverity: move-and-improve-alerts-non-prod
